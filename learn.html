<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한자 배우기 - 한자야 놀자!</title>
<meta name="description" content="카테고리와 난이도별로 생활 한자를 애니메이션과 따라쓰기로 재미있게 배워보세요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@500;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<meta name="google-adsense-account" content="ca-pub-3321070604000141">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3321070604000141" crossorigin="anonymous"></script>
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-char">漢</span>
      <span>한자야 놀자!</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기"><i class="fa-solid fa-bars"></i></button>
    <nav class="main-nav" id="main-nav"></nav>
  </div>
</header>

<main class="section" style="padding-top:30px;">
  <div class="container">
    <div class="section-head" style="margin-bottom:24px;">
      <span class="eyebrow">LEARN HANZI</span>
      <h2>한자 배우기 & 따라쓰기</h2>
      <p>카테고리와 단계를 골라 애니메이션으로 원리를 보고, 직접 손으로 따라 써보세요!</p>
    </div>

    <div class="learn-layout">
      <!-- ---------------- 필터 패널 ---------------- -->
      <aside class="filter-panel">
        <h3><i class="fa-solid fa-magnifying-glass"></i> 한자 검색</h3>
        <input type="text" id="search-input" placeholder="뜻이나 소리로 찾기 (예: 물, 수, 뫼)">

        <div class="filter-group">
          <h3>주제별 카테고리</h3>
          <div id="filter-category"></div>
        </div>

        <div class="filter-group">
          <h3>학습 단계</h3>
          <div id="filter-level"></div>
        </div>

        <div class="progress-box">
          <h3 style="margin-bottom:0;">나의 학습 진도</h3>
          <div class="progress-bar-track"><div class="progress-bar-fill" id="progress-fill"></div></div>
          <div class="progress-label" id="progress-label">0 / 0자 학습 완료</div>
        </div>
      </aside>

      <!-- ---------------- 한자 카드 그리드 ---------------- -->
      <section>
        <div class="hanzi-grid" id="hanzi-grid"></div>
      </section>
    </div>
  </div>
</main>

<!-- ---------------- 상세 학습 및 따라쓰기 모달 ---------------- -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-box modal-wide">
    <button class="modal-close" id="modal-close"><i class="fa-solid fa-xmark"></i></button>

    <div class="detail-head">
      <div class="detail-sound" id="detail-sound"></div>
      <div class="detail-meaning" id="detail-meaning"></div>
    </div>

    <!-- 모달 탭 스위처 -->
    <div class="modal-tabs">
      <button class="modal-tab active" data-tab="anim"><i class="fa-solid fa-wand-magic-sparkles"></i> 조립 애니메이션</button>
      <button class="modal-tab" data-tab="write"><i class="fa-solid fa-pen-nib"></i> 직접 따라쓰기</button>
    </div>

    <!-- 탭 1: 애니메이션 뷰 -->
    <div class="tab-content active" id="tab-anim-content">
      <div class="detail-stage-wrap">
        <div class="char-stage" id="detail-stage"></div>
      </div>

      <div class="detail-controls">
        <button class="btn btn-secondary btn-sm" id="detail-replay"><i class="fa-solid fa-rotate-right"></i> 다시 보기</button>
        <button class="btn btn-outline btn-sm" id="detail-slow"><i class="fa-solid fa-gauge-simple"></i> 천천히 보기</button>
      </div>

      <div class="parts-legend" id="parts-legend"></div>
    </div>

    <!-- 탭 2: 따라쓰기 뷰 -->
    <div class="tab-content" id="tab-write-content">
      <div class="write-pad-wrapper" id="write-pad-mount"></div>
    </div>

    <!-- 어원 이야기 및 실생활 낱말 (공통) -->
    <div class="story-box" id="story-box"></div>
    <div class="words-list" id="words-list"></div>

    <div class="detail-footer-actions">
      <button class="btn btn-primary" id="mark-learned"><i class="fa-solid fa-star"></i> 다 배웠어요!</button>
      <button class="btn btn-outline" id="detail-next"><i class="fa-solid fa-forward"></i> 다음 한자</button>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container foot-grid">
    <div>
      <h4>漢 한자야 놀자!</h4>
      <p>초등학교 1학년부터 천자문 마스터까지!<br>애니메이션 & 따라쓰기 한자 학습 사이트</p>
    </div>
    <div>
      <h4>바로가기</h4>
      <p><a href="learn.html">한자 배우기</a> · <a href="quiz.html">퀴즈로 복습</a></p>
    </div>
    <div>
      <h4>안내</h4>
      <p>학습 결과와 진도는 브라우저 로컬 저장소에 안전하게 보관돼요.</p>
    </div>
  </div>
  <div class="container foot-bottom">© 2026 한자야 놀자! 어린이를 위한 한자 학습 사이트</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="js/nav.js"></script>
<script src="js/hanzi-data.js"></script>
<script src="js/animation.js"></script>
<script src="js/speech.js"></script>
<script src="js/write-pad.js"></script>
<script src="js/srs.js"></script>
<script src="js/progress.js"></script>
<script src="js/auth.js"></script>
<script src="js/learn.js"></script>
</body>
</html>
