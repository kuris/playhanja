<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>퀴즈로 복습 - 한자야 놀자!</title>
<meta name="description" content="배운 한자를 퀴즈로 재미있게 복습해요.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@500;700;900&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="nav-wrap">
    <a href="index.html" class="logo">
      <span class="logo-char">漢</span>
      <span>한자야 놀자!</span>
    </a>
    <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기"><i class="fa-solid fa-bars"></i></button>
    <nav class="main-nav" id="main-nav">
      <ul>
        <li><a href="index.html">홈</a></li>
        <li><a href="learn.html">한자 배우기</a></li>
        <li><a href="thousand.html">📜 천자문 250구</a></li>
        <li><a href="quiz.html" class="active">퀴즈로 복습</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="section">
  <div class="container">
    <div class="section-head" style="margin-bottom:24px;">
      <span class="eyebrow">QUIZ TIME</span>
      <h2>퀴즈로 복습하기</h2>
      <p>한자를 보고 알맞은 뜻을 맞혀보세요. 학습한 한자가 우선 출제돼요!</p>
    </div>

    <div id="quiz-setup" class="quiz-box">
      <h3 style="margin-top:0;">퀴즈 범위를 골라주세요</h3>
      <div class="filter-group" style="text-align:left; margin-top:20px;">
        <div id="quiz-category-filter"></div>
      </div>
      <button class="btn btn-primary" id="start-quiz-btn" style="margin-top:10px;"><i class="fa-solid fa-play"></i> 퀴즈 시작!</button>
      <p style="margin-top:14px; color:var(--color-text-soft); font-size:.9rem;" id="quiz-range-info"></p>
    </div>

    <div class="quiz-box" id="quiz-play" style="display:none;">
      <div class="quiz-progress" id="quiz-progress"></div>
      <div class="quiz-char" id="quiz-char"></div>
      <div class="quiz-question" id="quiz-question">이 한자의 뜻은 무엇일까요?</div>
      <div class="quiz-options" id="quiz-options"></div>
    </div>

    <div class="quiz-box quiz-result" id="quiz-result">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h3 id="result-title"></h3>
      <p id="result-desc"></p>
      <div class="hero-actions" style="justify-content:center;">
        <button class="btn btn-primary" id="retry-quiz-btn"><i class="fa-solid fa-rotate-right"></i> 다시 풀기</button>
        <a href="learn.html" class="btn btn-outline"><i class="fa-solid fa-book-open"></i> 더 배우러 가기</a>
      </div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container foot-grid">
    <div>
      <h4>漢 한자야 놀자!</h4>
      <p>초등학교 1학년부터 시작할 수 있는<br>애니메이션 한자 학습 사이트</p>
    </div>
    <div>
      <h4>바로가기</h4>
      <p><a href="learn.html">한자 배우기</a> · <a href="quiz.html">퀴즈로 복습</a></p>
    </div>
    <div>
      <h4>안내</h4>
      <p>이 학습 결과와 진도는 사용 중인 기기의 브라우저에 저장돼요.</p>
    </div>
  </div>
  <div class="container foot-bottom">© 2026 한자야 놀자! 어린이를 위한 한자 학습 사이트</div>
</footer>

<script src="js/hanzi-data.js"></script>
<script src="js/progress.js"></script>
<script src="js/quiz.js"></script>
</body>
</html>
